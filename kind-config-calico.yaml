# Cluster Kind de la v5 avec Calico comme CNI.
# À utiliser UNIQUEMENT si v5-test-egress.sh montre que kindnet n'applique pas le filtrage sortant
# (voir v5-recreate-calico.sh, qui crée ce cluster puis installe Calico).
#
# disableDefaultCNI : Kind n'installe pas kindnet ; Calico le remplace.
# podSubnet         : plage d'adresses des pods, celle que Calico utilise par défaut.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloudia-v5
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
- role: control-plane
- role: worker
  labels:
    workload: ingestion # broker + générateur + pile d'observabilité
- role: worker
  labels:
    workload: compute # moteur d'IA
