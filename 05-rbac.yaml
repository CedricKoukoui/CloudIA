metadata:
  name: cloudia-observability-viewer
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "endpoints", "events", "resourcequotas", "limitranges"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
