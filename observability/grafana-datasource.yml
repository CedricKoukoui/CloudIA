# Source de données Grafana provisionnée au démarrage.
# L'uid fixe "prometheus" est utilisé par le tableau de bord et par test_observability.py.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
