name: Telecom IA Cloud-Native CI/CD (Scénario de Limite V1)

on:
  push:
    branches: [ "v1_limit" ]
  pull_request:
    branches: [ "v1_limit" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code du dépôt (Mis à jour en v4 pour éviter les avertissements d'obsolescence)
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configuration de l'environnement Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Installation des dépendances pour validation
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Étape de Linting (Vérification des erreurs de syntaxe Python)
    - name: Lint Python Code avec Flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # 5. Validation des fichiers Kubernetes (YAML)
    - name: Validate Kubernetes Manifests (Dry-Run)
      run: |
        # Utilisation de kubeconform ou d'une validation de structure native
        sudo apt-get update && sudo apt-get install -y kubectl
        kubectl diff -f deployment.yaml --local || true
        kubectl diff -f prometheus-link.yaml --local || true

    # 6. Simulation de Build Docker
    - name: Build Docker Image (Validation)
      run: |
        docker build -t telecom-ia:${{ github.sha }} .

    # 7. Exécution du Scénario de Crash (Validation de la Limite V1)
    # Cette étape va exécuter le docker-compose et provoquer le crash-test de RabbitMQ.
    # Le pipeline s'arrêtera ici et passera volontairement au ROUGE.
    - name: Run Integration Crash Test
      run: |
        docker compose -f docker-compose.test.yml build --no-cache
        docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from tester
    # 5. Validation des fichiers Kubernetes (YAML)
    - name: Validate Kubernetes Manifests (Dry-Run)
      run: |
        # Utilisation de kubeconform ou d'une validation de structure native
        sudo apt-get update && sudo apt-get install -y kubectl
        kubectl diff -f deployment.yaml --local || true
        kubectl diff -f prometheus-link.yaml --local || true

    # 6. Simulation de Build Docker (Vérifie que l'image v3 se compile sans erreur)
    - name: Build Docker Image (Validation)
      run: |
        docker build -t telecom-ia:${{ github.sha }} .

