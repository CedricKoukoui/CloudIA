name: Telecom IA Cloud-Native CI/CD

# À chaque push (et pull request) sur main, v3, v4, v5 ou v6 :
#   CI : Linting          -> syntaxe Python, test du TLS mutuel, fichiers de configuration, manifestes Kubernetes,
#                            règles de sécurité (v5), cohérence du modèle et règles du passage à l'échelle (v6),
#                            scripts shell
#   CI : Test E2E         -> docker-compose.test.yml : registre MLflow + entraînement centralisé (v6), puis
#                            générateur -> RabbitMQ -> IA -> Prometheus -> Grafana, panne du broker et reprise
#   CD : Image du cluster -> construction, contrôle et publication de l'image (push uniquement)
on:
  push:
    branches: [ "main", "v3", "v4", "v5", "v6" ]
  pull_request:
    branches: [ "main", "v3", "v4", "v5", "v6" ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI : Linting
  # ---------------------------------------------------------------------------
  lint:
    name: CI · Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pyyaml pika numpy==1.26.4 scikit-learn==1.4.2

    # Erreurs de syntaxe Python et noms indéfinis
    - name: Lint Python code (flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # Les fichiers lus par Prometheus et Grafana doivent être du YAML / JSON valide
    - name: Validate observability config (YAML / JSON)
      run: |
        python - <<'PY'
        import json, yaml
        for f in ("observability/prometheus.yml", "observability/grafana-datasource.yml",
                  "observability/grafana-dashboards.yml"):
            yaml.safe_load(open(f, encoding="utf-8"))
            print("YAML valide :", f)
        d = json.load(open("observability/cloudia-v3-dashboard.json", encoding="utf-8"))
        print("JSON valide : tableau de bord", d["uid"], "-", len(d["panels"]), "panneaux")
        PY

    # v4 : la configuration d'observabilité doit rester cohérente (rétention, ressources, volume)
    - name: Validate observability values (retention, resources, volume)
      run: |
        python - <<'PY'
        import re, yaml
        v = yaml.safe_load(open("observability-values.yaml", encoding="utf-8"))
        def size(s):
            m = re.fullmatch(r"(\d+(?:\.\d+)?)\s*(KB|MB|GB|KiB|MiB|GiB|Ki|Mi|Gi)", str(s))
            k = {"KB": 1e3, "MB": 1e6, "GB": 1e9, "KiB": 2**10, "MiB": 2**20, "GiB": 2**30,
                 "Ki": 2**10, "Mi": 2**20, "Gi": 2**30}[m.group(2)]
            return float(m.group(1)) * k
        spec = v["prometheus"]["prometheusSpec"]
        pvc = spec["storageSpec"]["volumeClaimTemplate"]["spec"]["resources"]["requests"]["storage"]
        ratio = size(spec["retentionSize"]) / size(pvc)
        assert ratio <= 0.85, f"retentionSize ({spec['retentionSize']}) trop proche du volume ({pvc})"
        print(f"Rétention : {spec['retention']} / {spec['retentionSize']} pour un volume de {pvc} ({ratio:.0%})")
        composants = {
            "prometheus": spec, "grafana": v["grafana"], "grafana.sidecar": v["grafana"]["sidecar"],
            "prometheusOperator": v["prometheusOperator"],
            "prometheusConfigReloader": v["prometheusOperator"]["prometheusConfigReloader"],
            "alertmanager": v["alertmanager"]["alertmanagerSpec"],
            "kube-state-metrics": v["kube-state-metrics"],
            "prometheus-node-exporter": v["prometheus-node-exporter"],
        }
        for nom, c in composants.items():
            for niveau in ("requests", "limits"):
                assert c["resources"][niveau]["cpu"] and c["resources"][niveau]["memory"], f"{nom}: {niveau} incomplet"
            print("Ressources déclarées :", nom)
        for nom in ("prometheus", "grafana", "prometheusOperator", "kube-state-metrics"):
            c = composants[nom]
            assert c.get("nodeSelector", {}).get("workload") == "ingestion", f"{nom}: nodeSelector manquant"
        print("nodeSelector : workers « ingestion »")
        PY

    # v5 (Q3) : logique TLS mutuelle du client AMQP, testée avec de vrais certificats (sans RabbitMQ)
    - name: Test AMQP TLS client (mutual TLS)
      run: python test_amqp_tls.py

    # v5 (Q3, Q9, Q14) : les règles de sécurité des manifestes (RBAC, réseau, secrets, durcissement des pods)
    - name: Check security rules (RBAC, network, secrets)
      run: python check_security.py

    # v6 : le piège de la v5 (un modèle par pod) mesuré, et la correction vérifiée (sans registre)
    - name: Test model consistency (centralized training)
      run: python test_model_consistency.py

    # v6 : pas d'entraînement dans app.py, autoscaler cohérent avec le quota, registre bien configuré
    - name: Check scaling rules (autoscaler, quota, model registry)
      run: python check_scaling.py

    # Les scripts d'exploitation de la v5 et de la v6 (shellcheck est préinstallé sur ubuntu-latest)
    - name: Lint shell scripts
      run: shellcheck -S warning -e SC2034 v5-*.sh v6-*.sh

    - name: Validate docker-compose.test.yml
      run: docker compose -f docker-compose.test.yml config -q

    - name: Install kubeconform
      run: |
        curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
        sudo mv kubeconform /usr/local/bin/

    # Validation réelle des manifestes : schémas officiels + CRD (PodMonitor, PrometheusRule, ScaledObject), mode strict.
    # -strict refuse les champs inconnus (ex. "environment:" au lieu de "env:").
    - name: Validate Kubernetes manifests (schemas, strict)
      run: |
        kubeconform -strict -summary \
          -schema-location default \
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
          01-namespaces-quotas.yaml \
          02-network-policy.yaml \
          03-observability-quota.yaml \
          04-network-policy-observability.yaml \
          05-rbac.yaml \
          06-alert-rules.yaml \
          07-tenant-simulation.yaml \
          08-mlops.yaml \
          09-train-job.yaml \
          10-autoscaling.yaml \
          rabbitmq-v3-persistant.yaml \
          deployment.yaml \
          generator-deployment.yaml \
          prometheus-link.yaml

  # ---------------------------------------------------------------------------
  # CI : Test E2E (exécute docker-compose.test.yml)
  # ---------------------------------------------------------------------------
  e2e:
    name: CI · Test E2E (docker-compose.test.yml)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Le script de test tourne sur le runner et n'a besoin que de "requests"
    # (il pilote le conteneur RabbitMQ avec la CLI docker, d'où l'absence de service "testeur")
    - name: Install test dependencies
      run: pip install requests

    # v6 : le registre d'abord, puis l'entraînement centralisé (une fois), puis le reste de la chaîne.
    # L'IA ne démarre (healthcheck) qu'après avoir téléchargé le modèle promu.
    - name: Start the model registry and the broker
      run: docker compose -f docker-compose.test.yml up -d --build --wait --wait-timeout 240 mlflow rabbitmq

    - name: Train, validate and promote the model (once)
      run: docker compose -f docker-compose.test.yml run --rm --build trainer

    - name: Start the stack (generator, RabbitMQ, IA, Prometheus, Grafana)
      run: docker compose -f docker-compose.test.yml up -d --build --wait --wait-timeout 240

    # 1. Contrôle de la chaîne jusqu'à Grafana (cible Prometheus UP, source de données, tableau de bord,
    #    compteur de l'IA lu à travers Grafana)
    # 2. SIGKILL du conteneur RabbitMQ, 12 s d'attente, redémarrage avec le même volume
    # 3. Le flux reprend, l'IA n'a pas redémarré, et Grafana voit le compteur augmenter
    - name: Test jusqu'à Grafana et crash-test du broker
      env:
        TEST_MODE: compose
        TEST_TIMEOUT: "150"
        STACK_TIMEOUT: "120"
      run: python test_observability.py

    - name: Diagnostics (en cas d'échec)
      if: failure()
      run: |
        docker compose -f docker-compose.test.yml ps -a
        docker compose -f docker-compose.test.yml logs --tail=80

    - name: Cleanup
      if: always()
      run: docker compose -f docker-compose.test.yml down -v

  # ---------------------------------------------------------------------------
  # CD : Image du cluster (publiée uniquement sur un push, jamais sur une pull request)
  # ---------------------------------------------------------------------------
  cd-image:
    name: CD · Image du cluster
    needs: e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # publication sur GitHub Container Registry avec le GITHUB_TOKEN

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Nom d'image en minuscules (obligatoire) et étiquettes : SHA du commit, nom de la branche, latest sur main
    - name: Compute image name and tags
      id: meta
      run: |
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        {
          echo "tags<<EOF"
          echo "${image}:${GITHUB_SHA}"
          echo "${image}:${GITHUB_REF_NAME//\//-}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then echo "${image}:latest"; fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Construction locale (sans publication) pour contrôler l'image avant de la publier
    - name: Build image (local)
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        push: false
        tags: telecom-ia:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test the image
      run: docker run --rm telecom-ia:ci python -c "import numpy, sklearn, pika, prometheus_client, mlflow.sklearn, model_registry, model_lib; print('imports OK')"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Même construction (couches en cache), cette fois publiée. Pour ne PAS publier, mets push: false.
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha
