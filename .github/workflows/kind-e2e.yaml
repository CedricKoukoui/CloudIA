name: Kind E2E (manuel)

# Test de bout en bout sur un vrai cluster Kind à 3 nœuds (v5, v6) : labels, nodeSelector, ResourceQuotas,
# NetworkPolicy (entrée ET sortie), RBAC, TLS mutuel, secrets, panne du broker ; v6 : registre MLflow,
# entraînement centralisé, 3 pods de l'IA qui servent le même modèle et se partagent la file.
# KEDA et Prometheus ne sont pas installés ici (trop lourds pour ce job) : l'autoscaling lui-même est
# vérifié sur le cluster local (v6-checks.sh, v6-load-test.sh). Plus lourd que la sonde
# Compose (≈ 10 min) : il ne tourne pas à chaque push, mais à la demande
# (GitHub > Actions > "Kind E2E (manuel)" > Run workflow).
#
# Choix du CNI (réseau du cluster) :
#   calico  : applique les NetworkPolicy en entrée et en sortie (défaut ; config kind-config-calico.yaml)
#   kindnet : CNI par défaut de Kind (config kind-config.yaml) ; le filtrage sortant n'y est pas garanti
on:
  workflow_dispatch:
    inputs:
      cni:
        description: "CNI du cluster Kind"
        type: choice
        options: [calico, kindnet]
        default: calico

permissions:
  contents: read

env:
  CNI: ${{ inputs.cni }}
  CLUSTER: ${{ inputs.cni == 'calico' && 'cloudia-v5' || 'cloudia-v3' }}
  KIND_CONFIG: ${{ inputs.cni == 'calico' && 'kind-config-calico.yaml' || 'kind-config.yaml' }}

jobs:
  e2e-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Le script de test n'a besoin que de "requests" (le reste tourne dans le cluster)
    - name: Install test dependencies
      run: pip install requests

    # Avec Calico, les nœuds ne sont prêts qu'après l'installation du CNI : on n'attend donc pas ici
    - name: Create Kind cluster (3 nodes, labels from the kind config)
      uses: helm/kind-action@v1.10.0
      with:
        config: ${{ env.KIND_CONFIG }}
        cluster_name: ${{ env.CLUSTER }}
        wait: ${{ inputs.cni == 'calico' && '0s' || '60s' }}

    - name: Install Calico
      if: inputs.cni == 'calico'
      run: |
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
        kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
        kubectl wait --for=condition=Ready nodes --all --timeout=300s

    # Le filtrage sortant doit être appliqué par le CNI choisi (sinon la suite n'aurait pas de sens)
    - name: Check that the CNI enforces egress policies
      run: ./v5-test-egress.sh

    - name: Build and load image into Kind
      run: |
        docker build -t telecom-ia:latest .
        kind load docker-image telecom-ia:latest --name "$CLUSTER"

    # Seules les CRD sont installées (pas l'opérateur) : suffisant pour accepter le PodMonitor
    - name: Install Prometheus Operator CRDs
      run: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
        helm install prometheus-operator-crds prometheus-community/prometheus-operator-crds

    # v5 : certificats et Secrets (créés par le script, jamais commités), comptes de service, puis le broker
    - name: Deploy namespaces, secrets, RBAC and broker
      run: |
        kubectl apply -f 01-namespaces-quotas.yaml
        kubectl label namespace ia ingestion pod-security.kubernetes.io/enforce=restricted --overwrite
        ./v5-secrets.sh
        kubectl apply -f 05-rbac.yaml
        kubectl apply -f rabbitmq-v3-persistant.yaml
        kubectl rollout status statefulset/telecom-broker-rabbitmq -n ingestion --timeout=240s

    # v6 : registre de modèles, puis entraînement centralisé (avant l'IA, qui attend le modèle promu)
    - name: Deploy model registry and train the model once
      run: |
        kubectl apply -f 08-mlops.yaml
        kubectl rollout status deploy/mlflow -n mlops --timeout=300s
        kubectl create -f 09-train-job.yaml
        kubectl wait -n mlops --for=condition=complete job -l app=model-trainer --timeout=300s
        kubectl logs -n mlops -l app=model-trainer --tail=20

    - name: Deploy IA, generator, observability link and network policies
      run: |
        kubectl apply -f deployment.yaml -f generator-deployment.yaml -f prometheus-link.yaml
        kubectl apply -f 02-network-policy.yaml
        kubectl rollout status deploy/telecom-ia-deployment -n ia --timeout=240s
        kubectl rollout status deploy/telecom-generator-deployment -n ingestion --timeout=240s
        kubectl get pods -A -o wide

    # Pilier C : chaque pod doit tourner sur le worker au rôle attendu
    - name: Check pod placement (nodeSelector)
      run: |
        check() {
          node=$(kubectl get pod -n "$1" -l "$2" -o jsonpath='{.items[0].spec.nodeName}')
          role=$(kubectl get node "$node" -o jsonpath='{.metadata.labels.workload}')
          echo "$2 -> $node (workload=$role, attendu=$3)"
          [ "$role" = "$3" ]
        }
        check ia app=telecom-ia compute
        check ingestion app=rabbitmq ingestion
        check ingestion app=telecom-generator ingestion
        check mlops app=mlflow compute

    # v5 : secrets, TLS mutuel, isolation réseau (entrée et sortie), RBAC, attaque simulée (Q3, Q9, Q14)
    - name: Security checks (v5-checks.sh)
      run: |
        kubectl apply -f 07-tenant-simulation.yaml
        CI_MODE=1 ./v5-checks.sh

    # v6 : 3 pods de l'IA (à la main, sans KEDA) -> un seul modèle, et chaque pod consomme une part de la file
    - name: Scale out to 3 pods (same model, competing consumers)
      run: |
        kubectl scale deployment/telecom-ia-deployment -n ia --replicas=3
        kubectl rollout status deploy/telecom-ia-deployment -n ia --timeout=240s
        sleep 45
        for p in $(kubectl get pods -n ia -l app=telecom-ia -o name); do
          model=$(kubectl logs -n ia "$p" | grep -m1 'Modèle version')
          seen=$(kubectl logs -n ia "$p" | grep -cE 'Normal|ANOMALIE' || true)
          echo "$p : $model | messages journalisés : $seen"
          [ "$seen" -gt 0 ] || { echo "$p n'a reçu aucun message"; exit 1; }
        done
        CI_MODE=1 ./v6-checks.sh
        kubectl scale deployment/telecom-ia-deployment -n ia --replicas=1
        kubectl rollout status deploy/telecom-ia-deployment -n ia --timeout=240s

    # Supprime le broker et vérifie que le flux reprend ET que l'IA n'a pas redémarré
    - name: Crash-test de résilience (suppression du broker)
      env:
        TEST_TIMEOUT: "180"
      run: python test_observability.py

    - name: Diagnostics (en cas d'échec)
      if: failure()
      run: |
        kubectl get pods -A -o wide || true
        kubectl describe pods -n ia || true
        kubectl logs -n ia deploy/telecom-ia-deployment --tail=50 || true
        kubectl logs -n ingestion deploy/telecom-generator-deployment --tail=50 || true
        kubectl logs -n ingestion statefulset/telecom-broker-rabbitmq --tail=50 || true
        kubectl logs -n mlops deploy/mlflow --tail=50 || true
        kubectl get jobs -n mlops || true
