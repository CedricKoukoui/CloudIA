apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: ingestion # 👈 Déplacé dans le compartiment réseau/ingestion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# v5 (Q3) : configuration TLS du broker. Le fichier est lu par RabbitMQ dans /etc/rabbitmq/conf.d/.
#  - un écouteur AMQP chiffré sur 5671 ;
#  - verify_peer + fail_if_no_peer_cert : TLS MUTUEL, tout client doit présenter un certificat
#    signé par l'autorité du projet (créée par v5-secrets.sh).
# L'écouteur en clair (5672) existe encore à l'intérieur du pod, mais le Service ne l'expose pas et
# la NetworkPolicy ne l'autorise depuis aucun pod. Pour le supprimer aussi côté broker, ajouter
# la ligne « listeners.tcp = none » ci-dessous (non activée par défaut : vérifiée seulement par la
# documentation de RabbitMQ, pas testée sur ce cluster).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-tls-conf
  namespace: ingestion
data:
  20-tls.conf: |
    listeners.ssl.default = 5671
    ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt
    ssl_options.certfile = /etc/rabbitmq/tls/tls.crt
    ssl_options.keyfile = /etc/rabbitmq/tls/tls.key
    ssl_options.verify = verify_peer
    ssl_options.fail_if_no_peer_cert = true
---
# v5 (Q14) : compte de service dédié, sans jeton (le broker n'appelle pas l'API Kubernetes)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telecom-broker-rabbitmq
  namespace: ingestion # 👈 Déplacé dans le compartiment réseau/ingestion
spec:
  serviceName: "telecom-broker-rabbitmq"
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      serviceAccountName: rabbitmq
      automountServiceAccountToken: false
      nodeSelector:
        workload: ingestion # 👈 Pilier C : le broker est toujours recréé sur le même worker (celui de son PVC)
      securityContext: # v5 : l'utilisateur « rabbitmq » de l'image officielle (uid 999), plus de root
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 5671
          name: amqps
        - containerPort: 15672
          name: management
        env:
        # v5 (Q14) : identifiants lus dans le Secret « rabbitmq-credentials » (créé par v5-secrets.sh).
        # Attention : RabbitMQ ne lit ces variables qu'à la CRÉATION du compte (premier démarrage
        # du volume). Sur un volume existant, v5-secrets.sh change le mot de passe avec rabbitmqctl.
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: username
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: password
        resources: # 👈 Obligatoire pour passer le ResourceQuota du namespace ingestion
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
        - name: tls-conf
          mountPath: /etc/rabbitmq/conf.d/20-tls.conf
          subPath: 20-tls.conf
          readOnly: true
        - name: tls
          mountPath: /etc/rabbitmq/tls
          readOnly: true
      volumes:
      - name: rabbitmq-data
        persistentVolumeClaim:
          claimName: rabbitmq-pvc
      - name: tls-conf
        configMap:
          name: rabbitmq-tls-conf
      - name: tls
        secret:
          secretName: rabbitmq-tls
          defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: telecom-broker-rabbitmq # 👈 Renommé pour correspondre aux URLs DNS de l'IA et du générateur
  namespace: ingestion # 👈 Déplacé dans le compartiment réseau/ingestion
spec:
  ports:
  - port: 5671 # v5 : AMQP chiffré uniquement (le port 5672 n'est plus exposé)
    targetPort: 5671
    name: amqps
  - port: 15672
    targetPort: 15672
    name: management
  selector:
    app: rabbitmq
