apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: ingestion # 👈 Déplacé dans le compartiment réseau/ingestion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telecom-broker-rabbitmq
  namespace: ingestion # 👈 Déplacé dans le compartiment réseau/ingestion
spec:
  serviceName: "telecom-broker-rabbitmq"
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      nodeSelector:
        workload: ingestion # 👈 Pilier C : le broker est toujours recréé sur le même worker (celui de son PVC)
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "user"
        - name: RABBITMQ_DEFAULT_PASS
          value: "password"
        resources: # 👈 Obligatoire pour passer le ResourceQuota du namespace ingestion
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
      volumes:
      - name: rabbitmq-data
        persistentVolumeClaim:
          claimName: rabbitmq-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: telecom-broker-rabbitmq # 👈 Renommé pour correspondre aux URLs DNS de l'IA et du générateur
  namespace: ingestion # 👈 Déplacé dans le compartiment réseau/ingestion
spec:
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
  selector:
    app: rabbitmq
