apiVersion: v1
kind: Service
metadata:
  name: telecom-ia-service
  namespace: ia # 👈 Déplacé dans le namespace IA
  labels:
    app: telecom-ia
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: metrics
  selector:
    app: telecom-ia
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: telecom-ia-podmonitor
  namespace: ia # 👈 L'opérateur Prometheus doit chercher le PodMonitor ici
  labels:
    release: telecom-monitor
spec:
  selector:
    matchLabels:
      app: telecom-ia
  podMetricsEndpoints:
  - port: metrics
    interval: 5s

