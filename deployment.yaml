apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-ia-deployment
  namespace: ia
  labels:
    app: telecom-ia
spec:
  # v6 : PAS de champ « replicas ». Le nombre de pods appartient à l'autoscaler (KEDA + HPA,
  # 10-autoscaling.yaml). Avec « replicas: 1 » ici, chaque « kubectl apply » de ce fichier remettrait
  # l'IA à 1 pod en pleine crise. (Au premier apply depuis la v5, le champ disparaît : l'IA revient à 1
  # pod, puis l'autoscaler reprend la main.)
  #
  # v6 : mise à jour progressive. Le quota de « ia » prévoit 1 pod de surplus (6 = 5 + 1) : le nouveau
  # pod démarre, charge le modèle, devient Ready, puis seulement un ancien pod s'arrête.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: telecom-ia
  template:
    metadata:
      labels:
        app: telecom-ia
    spec:
      # v5 (Q14) : compte de service dédié, sans jeton d'accès à l'API Kubernetes.
      serviceAccountName: telecom-ia
      automountServiceAccountToken: false
      nodeSelector:
        workload: compute # 👈 Pilier C : l'IA ne tourne que sur le worker "compute"
      # v6 : le temps de finir le message en cours et de fermer la connexion AMQP (SIGTERM -> app.py)
      terminationGracePeriodSeconds: 30
      securityContext: # v5 : le processus ne tourne plus en root
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001 # rend les certificats (Secret) lisibles par ce groupe
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ia-analyzer
        image: telecom-ia:latest
        imagePullPolicy: Never # 👈 Image injectée par `kind load docker-image`, jamais téléchargée
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8000
          name: metrics
        env:
        - name: PYTHONUNBUFFERED # 👈 Force les logs en temps réel
          value: "1"
        - name: HOME # l'uid 10001 n'a pas de dossier personnel : le client MLflow écrit dans /tmp
          value: /tmp
        # v6 : le modèle vient du registre (entraîné une seule fois par 09-train-job.yaml)
        - name: MLFLOW_TRACKING_URI
          value: http://mlflow.mlops.svc.cluster.local:5000
        - name: MODEL_NAME
          value: telecom-anomaly
        - name: MODEL_ALIAS
          value: production
        # v6 : messages réservés par pod (non acquittés). Petit = répartition plus fine entre les pods
        # quand l'autoscaler en ajoute ; grand = moins d'allers-retours avec le broker.
        - name: PREFETCH
          value: "50"
        # v5 (Q14) : identifiants lus dans un Secret (créé par v5-secrets.sh), plus en clair ici.
        # $(VAR) est remplacé par Kubernetes : ces deux variables doivent être déclarées avant l'URL.
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: password
        # v5 (Q3) : AMQP chiffré (amqps, port 5671), certificat du broker vérifié, certificat client présenté.
        - name: RABBITMQ_URL
          value: "amqps://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@telecom-broker-rabbitmq.ingestion.svc.cluster.local:5671/%2F"
        - name: AMQP_CA_FILE
          value: /etc/amqp-tls/ca.crt
        - name: AMQP_CERT_FILE
          value: /etc/amqp-tls/tls.crt
        - name: AMQP_KEY_FILE
          value: /etc/amqp-tls/tls.key
        # v6 : Ready = modèle du registre chargé ET consommation de la file en place (fichier écrit par
        # app.py). Sonde « exec » : elle s'exécute dans le conteneur, les NetworkPolicy ne la gênent pas.
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/model-ready"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: amqp-tls
          mountPath: /etc/amqp-tls
          readOnly: true
        # v6 : des pods plus petits mais plus nombreux. La limite CPU fixe la capacité d'un pod ;
        # l'autoscaler ajoute des pods quand cette capacité ne suffit plus (v6-load-test.sh la mesure).
        resources:
          limits:
            cpu: "250m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
      volumes:
      - name: amqp-tls
        secret:
          secretName: ia-tls
          defaultMode: 0440
